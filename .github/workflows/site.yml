# Publishes the website (WebSite/) on GitHub Pages, and checks that the plugin registry index is
# in sync with the plugin files.
name: site

on:
  push:
    branches: [main]
    paths: ['WebSite/**', 'registry/**', 'scripts/build-registry.js', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-registry.js --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: WebSite
      - id: deployment
        uses: actions/deploy-pages@v4
