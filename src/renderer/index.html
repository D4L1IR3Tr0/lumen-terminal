<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lumen</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="wallpaper"></div>
  <canvas id="bg-canvas"></canvas>

  <header id="bar">
    <div class="bar-left">
      <div class="logo" title="Lumen">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 5.5 11 12l-7 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 18.5h7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </div>
      <nav id="workspaces"></nav>
    </div>
    <div class="bar-center" id="title"></div>
    <div class="bar-right">
      <div id="stats"></div>
      <div id="status-items"></div>
      <button class="bar-btn" id="btn-settings" title="Settings (Ctrl+,)">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="bar-btn" id="btn-palette" title="Command palette (Ctrl+Shift+P)">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span id="clock"></span>
      <div class="win-controls">
        <button id="win-min" title="Minimize"><svg viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button id="win-max" title="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button id="win-close" title="Close"><svg viewBox="0 0 12 12"><path d="m3 3 6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2"/></svg></button>
      </div>
    </div>
  </header>

  <aside id="rail"></aside>
  <aside id="drawer"></aside>
  <main id="stage"></main>

  <div id="palette" class="hidden">
    <div class="palette-box">
      <div class="palette-input-row">
        <span class="palette-prefix" id="palette-prefix"></span>
        <input id="palette-input" spellcheck="false" autocomplete="off">
      </div>
      <div id="palette-list"></div>
      <div class="palette-footer"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> select</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <aside id="settings" class="hidden"></aside>

  <div id="toasts"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../shared/themes.js"></script>
  <script src="keys.js"></script>
  <script src="layout.js"></script>
  <script src="palette.js"></script>
  <script src="fonts.js"></script>
  <script src="background.js"></script>
  <script src="settings.js"></script>
  <script src="sidebar.js"></script>
  <script src="panels/graph.js"></script>
  <script src="panels/city.js"></script>
  <script src="panels/constellation.js"></script>
  <script src="panels/folders.js"></script>
  <script src="panels/ai.js"></script>
  <script src="panels/aliases.js"></script>
  <script src="panels/plugins.js"></script>
  <script src="app.js"></script>
</body>
</html>
